<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/Assets/Card-back.svg">
    <link rel="stylesheet" href="/Styles/style.css">
    
    <title>Paper Isle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script id="load-nav" src="/loadnav.js"></script>
    <main class="content-grid row-gap">
        <div class="card">
            <h1>About</h1>
            <p> UI Flow project.</p>
        </div>

            <h2>Wireframe</h2>
            <img src="Assets/Wireframe.png">

        </section>

        <section class="card">
            <h1>Flow</h1>
            <video controls muted poster="Assets/WireframeFlow_Thumbnail.png">

                <source src="Assets/WireframeFlow.mp4">
            </video>
        </section>
        <section class="card">
            <h1>Implementation</h1>
            <video controls muted poster="Assets/WireframeFlow_Thumbnail.png">

                <source src="Assets/ImplementedFlow.mp4">
            </video>
            <p>
                This was my first time using unity's UI Toolkit :3.
            </p>
        </section>
        
    </main>

</html>
