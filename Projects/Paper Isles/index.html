<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/Assets/Card-back.svg">
    <link rel="stylesheet" href="/Styles/style.css">
    
    <title>Paper Isle</title>

</head>

<body>
    <script id="load-nav" src="/loadnav.js"></script>
    <main class="content-grid row-gap">
        <div class="card">
            <h1>About</h1>

        <section class="card">
            <h2>Light Attack</h2>
            <video width="100%" controls>
                <source src="Videos/Light.mp4">
            </video>
            <p>Simple swing with particle trail</p>
        </section>
        <section class="card">
            <h2>Medium Attack</h2>
            <video width="100%" controls>

        </section>
        <section class="card">
            <h2>Heavy Attack</h2>
            <video width="100%" controls>
                <source src="Videos/Heavy.mp4">
            </video>
            
        </section>
        <section class="card">
            <h2>Taking Damage</h2>
            <video width="100%" controls>
                <source src="Videos/Damaged.mp4">
            </video>
            <p>WIP [I need to finish this one -_-]</p>
        </section>
        <section class="card">
            <h2> Prototyping </h2>
