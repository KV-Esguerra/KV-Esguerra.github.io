<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/Assets/Card-back.svg">
    <link rel="stylesheet" href="/Styles/style.css">
    
    <title>Paper Isle</title>
    <link rel="stylesheet" href="page.css">

    
</head>

<body>
    <script id="load-nav" src="/loadnav.js"></script>
    
    <main class="content-grid row-gap">
        <div class="card">
            <h1>About</h1>
            <p> Small combat feel project showing off various UX skills.</p>
        </div>

        <section id="attackCard" class="card attack">
            <div>
                <video id="Light">
                    <source src="Videos/Light.mp4">
                </video>
                <video id="Medium" >
                    <source src="Videos/Medium.mp4">
                </video>
                <video id="Heavy" >
                    <source src="Videos/Heavy-2.mp4">
                </video>
                <div class="buttons">
                    <button id="Light"></button>
                    <button id="Medium"></button>
                    <button id="Heavy"></button>
                </div>
            </div>
            <div>
                <h2>Light Attack</h2>    
                <p>Simple swing with particle trail</p>
            </div>
            
        </section>
        <section class="card">
            <h2>Medium Attack</h2>
            <video controls>
                <source src="Videos/Medium.mp4">
            </video>
            <p>Hitstop combined with a shader</p>
        </section>
        <section class="card">
            <h2>Heavy Attack</h2>
            <video controls>
                <source src="Videos/Heavy.mp4">
            </video>
            
        </section>
        <section class="card">
            <h2>Taking Damage</h2>
            <video controls>
                <source src="Videos/Damaged.mp4">
            </video>
            <p>WIP [I need to finish this one -_-]</p>
        </section>
        <section class="card">
            <h2> Prototyping </h2>
            <img src="Prototyping.png">
            <p>In project art made in figma</p>
        </section>
    </main>
    


    <script src="page.js"></script>
</body>
</html>
