<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/Assets/Card-back.svg">
    <link rel="stylesheet" href="/Styles/style.css">
    
    <title>Paper Isle</title>
    <link rel="stylesheet" href="page.css">

    
</head>

<body>
    <script id="load-nav" src="/loadnav.js"></script>
    
    <main class="content-grid row-gap">
        <div class="card">
            <h1>About</h1>
            <p> Small combat feel project showing off various UX skills.</p>
        </div>

        <section id="attackCard" class="card attack">
            <div>
                <video class="light">
                    <source src="Videos/Light.mp4">
                </video>
                <video class="medium" >
                    <source src="Videos/Medium.mp4">
                </video>
                <video class="heavy" >
                    <source src="Videos/Heavy-2.mp4">
                </video>
                <div class="buttons">
                    <button id="light" class="attackButton"><img src="Assets/Light-Icon.png"></button>
                    <button id="medium" class="attackButton"><img src="Assets/Medium-Icon.png"></button>
                    <button id="heavy" class="attackButton"><img src="Assets/Heavy-Icon.png"></button>
                </div>
            </div>
            <div>
                <h2 class="light">Light Attack</h2>
                <p class="light">Simple swing with particle trail</p>

                <h2 class="medium">Medium Attack</h2>
                <p class="medium">Hitstop combined with a shader</p>

                <h2 class="heavy">Heavy Atatack</h2>
                <p class="heavy"></p>
            </div>
            
        </section>
        
        <section class="card">
            <h2>Taking Damage</h2>
            <video controls>
                <source src="Videos/Damaged.mp4">
            </video>
            <p>WIP [I need to finish this one -_-]</p>
        </section>
        <section class="card">
            <h2> Prototyping </h2>
            <img src="Prototyping.png">
            <p>In project art made in figma</p>
        </section>
    </main>
    


    <script src="page.js"></script>
</body>
</html>
